name: Auto-rebuild dist on main

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    name: Rebuild dist/ if src changed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist/
        run: npm run build

      - name: Commit dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet dist/; then
            echo "📦 dist/ changed, committing..."
            git add dist/
            git commit -m "build: rebuild dist from src changes"
            git push
          else
            echo "✅ dist/ is already up-to-date"
          fi
