name: Self-test

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check

  staging-selftest:
    if: ${{ secrets.TILESMITH_STAGING_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Score benchmark fixtures
        uses: ./
        with:
          api-key: ${{ secrets.TILESMITH_STAGING_API_KEY }}
          paths: tests/fixtures/**
          upload-report: 'false'
